<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#06090b"/>
<title>Eval Lab Studio</title>
<meta name="description" content="AI 에이전트·RAG·스킬을 검증하고 평가하는 법. 짧은 영상 + 출처가 있는 실무 강의."/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="ambient" aria-hidden="true"></div>
    <header class="home-head">
      <div class="brand-mark">EL</div>
      <div>
        <p class="kicker">Eval Lab Studio</p>
        <h1>믿을 수 있는 답은<br/>측정에서 나온다</h1>
      </div>
    </header>
    <p class="lead" id="metaLine">불러오는 중…</p>
    <button type="button" class="resume" id="resumeBtn">
      <span class="resume-label">이어서 보기</span>
      <span class="resume-title" id="resumeTitle">—</span>
      <span class="resume-go">▶</span>
    </button>
    <div class="search"><input id="q" type="search" placeholder="강의 검색 (예: kappa, RAG, pass^k)" autocomplete="off"/></div>
    <div class="seg" role="tablist">
      <button type="button" class="seg-item active" data-filter="all">전체</button>
      <button type="button" class="seg-item" data-filter="unread">안 봄</button>
      <button type="button" class="seg-item" data-filter="video">영상</button>
    </div>
    <ol id="list" class="rail"></ol>
    <div id="upcoming" class="upcoming"></div>
    <p class="foot">출처가 없는 수치는 싣지 않습니다. 모든 강의 끝에 출처·확인일을 적었어요.</p>
  </section>

  <section id="watch" class="screen watch hidden">
    <div class="watch-frame">
      <div class="watch-top">
        <button type="button" class="ghost" id="backHome">목록</button>
        <div class="watch-progress"><div class="bar"><i id="barFill"></i></div><span id="watchCount">0/0</span></div>
      </div>
      <div class="cinema" id="cinema"></div>
      <div class="watch-panel">
        <p class="watch-kicker" id="watchKicker"></p>
        <h2 id="watchTitle"></h2>
        <p class="watch-sub" id="watchSub"></p>
        <div id="watchBody" class="prose"></div>
      </div>
    </div>
    <div class="transport">
      <button type="button" class="tr-btn" id="prevBtn" aria-label="이전 강의"><b>←</b><small>이전</small></button>
      <button type="button" class="tr-btn next" id="nextBtn" aria-label="다음 강의"><small>다음</small><b>→</b></button>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
